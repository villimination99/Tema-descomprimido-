[project]
name = "tradesys"
version = "0.1.0"
description = "Sistema de trading propio para MEXC + TradingView"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "ccxt>=4.3",
    "keyring>=25.0",
]

[project.scripts]
tradesys = "tradesys.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradesys"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
testpaths = ["tests"]
markers = ["network: tests que tocan la red (excluidos por defecto)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
